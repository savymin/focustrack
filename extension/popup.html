<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Student Monitor</title>
  <style>
    body { font-family: sans-serif; width: 260px; padding: 12px; margin: 0; }
    h3 { color: #1a73e8; margin-top: 0; font-size: 14px; }
    input, button { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; font-size: 13px; }
    button { background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1557b0; }
    #status { font-weight: bold; font-size: 12px; margin-top: 8px; padding: 6px; background: #f1f3f4; text-align: center; border-radius: 4px; }
  </style>
</head>
<body>
  <h3>Class Monitor Setup</h3>
  <input type="number" id="sessionId" placeholder="Session ID">
  <input type="text" id="studentName" placeholder="Your Full Name">
  <button id="saveBtn">Register & Connect</button>
  <div id="status">Status: Not Registered</div>
  <script src="popup.js"></script>
</body>
</html>
